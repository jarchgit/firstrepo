      # ── 1. Checkout the repository ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2   # FIX 3: pinned to patch that ships Node 24 runtime
        with:
          fetch-depth: 0   # full history needed to diff changed files

      # ── 2. Set up Node.js ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0   # FIX 4: pinned to patch that ships Node 24 runtime
        with:
          node-version: '20'   # this is YOUR app's Node version, unrelated to the action runtime

      # ── 3. Detect changed SQL files ─────────────────────────────
      - name: Get changed SQL/DDL files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs: compare base branch to head
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -E '\.(sql|ddl)$' || true)
          else
            # For pushes: compare previous commit to current
            # FIX 5: github.event.before is empty on the very first push to a branch;
            #         fall back to HEAD~1 so the diff never fails with a null SHA.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BEFORE" ${{ github.sha }} \
              | grep -E '\.(sql|ddl)$' || true)
          fi

          echo "Found changed SQL files:"
          echo "$CHANGED"

          # Pass as multiline env var
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "files<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          # Count files — guard against empty CHANGED producing a spurious "1"
          if [ -z "$CHANGED" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
          else
            COUNT=$(echo "$CHANGED" | grep -c '\S')
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      # ── 4. Skip if no SQL files changed ─────────────────────────
      # FIX 6: exit 0 inside an `if:` step that evaluates to true still marks
      #         the step as succeeded but does NOT stop subsequent steps from
      #         running. Use a job-level condition instead.
      - name: Check if there are SQL files to scan
        if: steps.changed-files.outputs.count == '0'
        run: |
          echo "ℹ️ No SQL/DDL files changed in this push. Skipping compliance check."

      - name: Verify agent scripts exist
        if: steps.changed-files.outputs.count != '0'
        run: |
          if [ ! -f ".github/compliance/compliance-engine-node.js" ]; then
            echo "❌ Missing: .github/compliance/compliance-engine-node.js"
            exit 1
          fi
          if [ ! -f ".github/compliance/compliance-runner.js" ]; then
            echo "❌ Missing: .github/compliance/compliance-runner.js"
            exit 1
          fi
          echo "✅ Agent scripts found"

      # ── 6. Run the compliance check ─────────────────────────────
      - name: Run DB Compliance Check
        if: steps.changed-files.outputs.count != '0'
        id: compliance
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          REPO_ROOT: ${{ github.workspace }}
          STANDARDS_PATH: .github/compliance/standards_cust_json.json
          FAIL_ON_SEVERITY: CRITICAL,HIGH
          OUTPUT_FORMAT: json
        run: |
          cd .github/compliance
          node compliance-runner.js
        continue-on-error: true   # we handle exit code manually below

      # ── 7. Post PR comment with results ─────────────────────────
      - name: Post compliance results as PR comment
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.count != '0'
        uses: actions/github-script@v7.0.1   # FIX 7: pinned to patch that ships Node 24 runtime
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.github/compliance/compliance-report.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No report file found, skipping comment.');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf8');

            // Find and delete any previous compliance comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments.data) {
              if (comment.body.includes('DB Compliance Check Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 8. Upload full report as artifact ───────────────────────
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4.6.2   # FIX 8: pinned to patch that ships Node 24 runtime
        with:
          name: compliance-report-${{ github.run_number }}
          path: |
            .github/compliance/compliance-report.md
            .github/compliance/compliance-report.json
          retention-days: 30

      # ── 9. Fail the workflow if violations were found ────────────
      - name: Enforce compliance result
        if: steps.compliance.outcome == 'failure'
        run: |
          echo "❌ DB Compliance check failed due to CRITICAL or HIGH violations."
          echo "   Review the compliance report in the PR comment or Actions summary."
          exit 1
